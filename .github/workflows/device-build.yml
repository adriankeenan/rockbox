name: Device Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # configure_target is tools/configure's modelname string, not the
          # (unstable) numeric menu id. Toolchains for both are baked into
          # the container image already, see Dockerfile.
          - name: AIGO Eros Q / K native
            configure_target: erosqnative
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            configure_target: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${CONFIGURE_TARGET}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Name artifact
        id: build-info
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
          ZIP_PATH: ${{ matrix.target.zip_path }}
          TZ: UTC
        run: |
          # rockbox-{target-id}-{commit datetime}-{commit id}.zip, where the
          # datetime is the commit date in UTC and the commit id matches the
          # abbreviation length used by tools/version.sh.
          commit_datetime="$(git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)"
          commit_id="$(git rev-parse --verify --short=10 HEAD)"
          name="rockbox-${CONFIGURE_TARGET}-${commit_datetime}-${commit_id}.zip"
          mv "${ZIP_PATH}" "build/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=build/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # With archive: false the uploaded file's own name becomes the
          # artifact name, so this must match the file we just renamed.
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ steps.build-info.outputs.path }}
          if-no-files-found: error
          archive: false
