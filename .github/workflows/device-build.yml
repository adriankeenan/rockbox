name: Device Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the build as the latest release'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:psp
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          # configure_target is tools/configure's modelname string, not the
          # (unstable) numeric menu id. Toolchains for both are baked into
          # the container image already, see Dockerfile.
          - name: AIGO Eros Q / K native
            configure_target: erosqnative
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            configure_target: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
          - name: Sony PSP
            configure_target: psp
            zip_target: zip
            zip_path: build/rockbox.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job runs in a container, so git sees a workspace owned by the
      # runner's uid while running as root and refuses it as "dubious
      # ownership". Steps below shell out to git, which fails without this.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${CONFIGURE_TARGET}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Name artifact
        id: build-info
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
          ZIP_PATH: ${{ matrix.target.zip_path }}
          TZ: UTC
        run: |
          commit_datetime="$(git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)"
          commit_id="$(git rev-parse --verify --short=10 HEAD)"
          name="rockbox-${CONFIGURE_TARGET}-${commit_datetime}-${commit_id}.zip"
          mv "${ZIP_PATH}" "build/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=build/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ steps.build-info.outputs.path }}
          if-no-files-found: error
          archive: false

  create-release:
    name: Publish latest release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get build info
        id: build-info
        env:
          TZ: UTC
        run: |
          echo "hash=$(git rev-parse --verify --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date_display=$(git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: firmware
          pattern: '*'
          merge-multiple: true

      - name: List firmware artifacts
        run: ls -sh firmware

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest
          name: Build ${{ steps.build-info.outputs.date_display }} ${{ steps.build-info.outputs.hash }}
          files: firmware/*
          generate_release_notes: false
          body: |
            Device builds of [this Rockbox fork](${{ github.server_url }}/${{ github.repository }}).

            Most recent build: commit [`${{ steps.build-info.outputs.hash }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) committed on ${{ steps.build-info.outputs.date_display }} UTC.

            Each build appends its zips below, named by target, build date and
            commit. See the
            [README](${{ github.server_url }}/${{ github.repository }}#new-targets)
            for installation instructions.
