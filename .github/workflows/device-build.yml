name: Device Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # id is tools/configure's menu selection number, not target_id --
          # the two are different fields and not necessarily related; see
          # each target's entry in tools/configure to confirm.
          - name: AIGO Eros Q / K native
            id: 247
            toolchain: mips
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            id: 310
            toolchain: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mips (rockboxdev.sh-built cross-compiler) and rg35xxpro (KNULLI's
      # prebuilt aarch64 SDK) need entirely different toolchains. rg35xxpro's
      # is already baked into the container image at a fixed path with
      # RG35XXPRO_SDK_PATH set globally (see Dockerfile) -- nothing to build
      # or cache here, unlike mips, whose toolchain is rebuilt from this
      # repo's own tools/rockboxdev.sh/patches rather than relying on
      # whatever happened to be baked into the image.
      - name: Install toolchain build dependencies
        if: matrix.target.toolchain == 'mips'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            texinfo automake libtool autoconf flex bison

      - name: Cache cross toolchain
        if: matrix.target.toolchain == 'mips'
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: /opt/rbtoolchain
          key: rbtoolchain-mips-${{ hashFiles('tools/rockboxdev.sh', 'tools/toolchain-patches/**') }}

      - name: Build cross toolchain
        if: matrix.target.toolchain == 'mips' && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/rbtoolchain
          RBDEV_PREFIX=/opt/rbtoolchain RBDEV_TARGET=i tools/rockboxdev.sh

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${TARGET_ID}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Get artifact name
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "name=rockbox-${TARGET_SLUG}-${TARGET_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ matrix.target.zip_path }}
          if-no-files-found: error
