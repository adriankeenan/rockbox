name: Device Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the build as a release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          # configure_target is tools/configure's modelname string, not the
          # (unstable) numeric menu id. Toolchains for both are baked into
          # the container image already, see Dockerfile.
          - name: AIGO Eros Q / K native
            configure_target: erosqnative
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            configure_target: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job runs in a container, so git sees a workspace owned by the
      # runner's uid while running as root and refuses it as "dubious
      # ownership". Steps below shell out to git, which fails without this.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${CONFIGURE_TARGET}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Name artifact
        id: build-info
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
          ZIP_PATH: ${{ matrix.target.zip_path }}
          TZ: UTC
        run: |
          commit_datetime="$(git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)"
          commit_id="$(git rev-parse --verify --short=10 HEAD)"
          name="rockbox-${CONFIGURE_TARGET}-${commit_datetime}-${commit_id}.zip"
          mv "${ZIP_PATH}" "build/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=build/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ steps.build-info.outputs.path }}
          if-no-files-found: error
          archive: false

  create-release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get build info
        id: build-info
        env:
          TZ: UTC
        run: |
          hash="$(git rev-parse --verify --short=10 HEAD)"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "date_display=$(git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          echo "tag=build-$(git log -1 --format=%cd --date=format-local:%Y%m%d)-${hash}" >> "$GITHUB_OUTPUT"

      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: 'rockbox-*.zip'
          merge-multiple: true
          # Artifacts are uploaded with archive:false, so without this the zips
          # get unpacked on download.
          skip-decompress: true

      - name: Check firmware artifacts
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
          EXPECTED_ZIPS: 2
        run: |
          ls -sh "$ASSET_DIR"
          found="$(find "$ASSET_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)"
          if [ "$found" -ne "$EXPECTED_ZIPS" ]; then
            echo "::error::expected ${EXPECTED_ZIPS} firmware zips, found ${found}"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.build-info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ steps.build-info.outputs.date_display }} (${{ steps.build-info.outputs.hash }})
          working_directory: ${{ runner.temp }}/release-assets
          files: '*.zip'
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
          body: |
            Device builds of [this Rockbox fork](${{ github.server_url }}/${{ github.repository }}).

            Built from commit [`${{ steps.build-info.outputs.hash }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}), committed on ${{ steps.build-info.outputs.date_display }} UTC.

            One zip per target below, named by target, build date and commit.
            See the
            [README](${{ github.server_url }}/${{ github.repository }}#new-targets)
            for installation instructions.
