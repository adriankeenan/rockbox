name: Device Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # configure_target is tools/configure's modelname string, not the
          # (unstable) numeric menu id. Toolchains for both are baked into
          # the container image already, see Dockerfile.
          - name: AIGO Eros Q / K native
            configure_target: erosqnative
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            configure_target: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
          - name: Sony PSP
            configure_target: psp
            zip_target: zip
            zip_path: build/rockbox.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${CONFIGURE_TARGET}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Get artifact name
        id: build-info
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          echo "name=rockbox-${CONFIGURE_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ matrix.target.zip_path }}
          if-no-files-found: error
          archive: false
