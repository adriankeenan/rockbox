name: Device Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-env:latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # configure_target is tools/configure's modelname string (its
          # --target= value), not target_id -- the two are different fields
          # and not necessarily related; see each target's entry in
          # tools/configure to confirm. Deliberately the string rather than
          # the numeric menu selection number: that number isn't stable --
          # it's been bumped once already to dodge a collision with
          # upstream's own numbering -- and using it here would mean this
          # workflow needing an update in lockstep every time it moves. The
          # modelname string doesn't have that problem.
          #
          # Both targets' toolchains are baked into the container image
          # (see Dockerfile) rather than built here: rg35xxpro's KNULLI SDK
          # at RG35XXPRO_SDK_PATH, and the mips cross-compiler at
          # /opt/rbtoolchain via rockboxdev.sh. Nothing to build or cache
          # in this workflow for either.
          - name: AIGO Eros Q / K native
            configure_target: erosqnative
            zip_target: zip
            zip_path: build/rockbox.zip
          - name: Anbernic RG35XX Pro
            configure_target: rg35xxpro
            zip_target: port-zip
            zip_path: build/rockbox-rg35xxpro.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          mkdir build
          cd build
          ../tools/configure --target="${CONFIGURE_TARGET}" --type=n

      - name: Build
        run: |
          export PATH="/opt/rbtoolchain/bin:$PATH"
          cd build
          make -j$(nproc)
          make ${{ matrix.target.zip_target }}

      - name: Get artifact name
        id: build-info
        env:
          CONFIGURE_TARGET: ${{ matrix.target.configure_target }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "name=rockbox-${TARGET_SLUG}-${CONFIGURE_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.name }}
          path: ${{ matrix.target.zip_path }}
          if-no-files-found: error
