name: Device Build

env:
  ARTIFACT_RETENTION_DAYS: 30

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  build-device:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-build-env:latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: AIGO Eros Q / K native
            id: 247
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockbox-${TARGET_SLUG}-${TARGET_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          mkdir build
          cd build
          ../tools/configure --type=n --target="${TARGET_ID}"

      - name: Build
        run: |
          cd build
          make -j$(nproc)
          make zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: build/rockbox.zip
          archive: false
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
