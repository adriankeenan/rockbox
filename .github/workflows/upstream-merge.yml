name: Weekly Upstream Merge

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - fetch and merge but do not push anything'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  upstream-merge:
    name: Merge upstream/master into fork master
    runs-on: ubuntu-latest

    env:
      MERGE_BRANCH: upstream-merge
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout fork master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for unresolved merge branch
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$MERGE_BRANCH" >/dev/null; then
            echo "::error::'$MERGE_BRANCH' already exists - a previous merge is unresolved. Resolve it, merge it into master, delete the branch, then re-run."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://git.rockbox.org/cgit/rockbox.git

      - name: Fetch upstream master
        run: git fetch upstream master --no-tags

      - name: Merge upstream/master
        id: merge
        run: |
          if git merge upstream/master --no-edit --no-ff; then
            exit 0
          fi

          # Commit the conflicted tree - markers and all - so the next step can
          # push it and it can be inspected from a normal checkout.
          git add -A
          git commit -m "Merge upstream/master (unresolved conflicts)"
          echo "::error::Merge conflict - see branch '$MERGE_BRANCH'. Resolve it, merge it into master, delete the branch, then re-run."
          exit 1

      - name: Push merged master
        if: env.DRY_RUN != 'true'
        run: git push origin master

      - name: Push conflicted merge
        if: failure() && steps.merge.conclusion == 'failure' && env.DRY_RUN != 'true'
        run: git push origin "HEAD:$MERGE_BRANCH"
