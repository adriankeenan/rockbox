name: Daily Upstream Merge

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - fetch and check for conflicts but do not push'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  upstream-merge:
    name: Merge upstream/master into fork master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://git.rockbox.org/cgit/rockbox.git

      - name: Fetch upstream master
        run: git fetch upstream master --no-tags

      - name: Merge upstream/master
        run: |
          if ! git merge upstream/master --no-edit --no-ff; then
            git merge --abort
            echo "::error::Merge conflict with upstream/master. Resolve manually and push."
            exit 1
          fi

      - name: Push merged master
        if: github.event.inputs.dry_run != 'true'
        run: git push origin master
